kind = "web"
previewPath = "/"
title = "مساحتنا"
description = "تطبيق مساحة مشتركة لشريكين لتسجيل المزاج والمهام والرسائل والذكريات، مبني على Next.js وFirebase."
version = "1.0.0"
id = "artifacts/masahatna-web"
router = "path"

[[services]]
name = "web"
paths = ["/", "/_next/hmr", "/_next/webpack-hmr"]
localPort = 23414

[services.development]
run = "pnpm --filter @workspace/masahatna run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/masahatna", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/masahatna", "run", "start"]

[services.production.run.env]
PORT = "23414"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "23414"
BASE_PATH = "/"
